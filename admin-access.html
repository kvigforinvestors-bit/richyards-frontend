<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255,255,255,0.05);
            border: 1px solid #c9a227;
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
        }
        h1 { color: #c9a227; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1a1a1a;
            border: 1px solid rgba(201,162,39,0.3);
            border-radius: 8px;
            color: white;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #c9a227;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .error { color: #ff6b6b; margin-top: 10px; }
        .admin-link { 
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #c9a227;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>?? Admin Portal</h1>
        <p>Enter your credentials to access the admin dashboard</p>
        <input type="text" id="username" placeholder="Username" autocomplete="off">
        <input type="password" id="password" placeholder="Password">
        <button onclick="verifyAndRedirect()">Access Dashboard</button>
        <div id="errorMsg" class="error"></div>
        <a href="https://richyards-frontend.pages.dev" class="admin-link">? Back to Website</a>
    </div>

    <script>
        async function verifyAndRedirect() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.textContent = '';
            
            try {
                const response = await fetch('https://richyards-api.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Store token and redirect to admin dashboard
                    localStorage.setItem('adminToken', data.token);
                    window.location.href = 'https://richyards-admin.pages.dev';
                } else {
                    errorMsg.textContent = 'Invalid username or password';
                }
            } catch(err) {
                errorMsg.textContent = 'Connection error. Please try again.';
            }
        }
    </script>
</body>
</html>
