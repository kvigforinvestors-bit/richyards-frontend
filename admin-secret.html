<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: #0b5d1e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-bottom: 3px solid #c9a227;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(201,162,39,0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-number { font-size: 36px; font-weight: bold; color: #c9a227; }
        table {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            overflow-x: auto;
            display: block;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th { background: #0b5d1e; color: #c9a227; }
        .login-form {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #c9a227;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1a1a1a;
            border: 1px solid #c9a227;
            border-radius: 8px;
            color: white;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #c9a227;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .logout-btn {
            background: #dc2626;
            color: white;
            width: auto;
            padding: 8px 16px;
        }
        .flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .badge {
            background: #c9a227;
            color: #0a0a0a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }
        @media (max-width: 768px) {
            th, td { font-size: 12px; padding: 8px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="loginScreen" class="login-form">
            <h2 style="color:#c9a227; margin-bottom:20px;">🔐 Admin Login</h2>
            <input type="password" id="password" placeholder="Enter Admin Password" autofocus>
            <button onclick="checkPassword()">Access Dashboard</button>
            <p id="errorMsg" style="color:#ff6b6b; margin-top:10px;"></p>
        </div>

        <div id="dashboard" style="display:none;">
            <div class="container">
                <div class="header">
                    <div class="flex">
                        <h1>📋 Contact Form Submissions</h1>
                        <button class="logout-btn" onclick="logout()">Logout</button>
                    </div>
                    <p style="margin-top:10px;">View all feedback from your website contact form</p>
                </div>
                <div class="stats" id="stats"></div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Date</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'admin123';  // Change this to your desired password
        const API_URL = 'https://richyards-api.onrender.com/api';
        let token = null;

        async function checkPassword() {
            const password = document.getElementById('password').value;
            if (password === ADMIN_PASSWORD) {
                await loginWithBackend('admin', password);
            } else {
                document.getElementById('errorMsg').innerText = 'Incorrect password';
            }
        }

        async function loginWithBackend(username, password) {
            try {
                const res = await fetch(${API_URL}/auth/login, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    token = data.token;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadData();
                } else {
                    document.getElementById('errorMsg').innerText = 'Authentication failed';
                }
            } catch(err) {
                document.getElementById('errorMsg').innerText = 'Connection error: ' + err.message;
            }
        }

        async function loadData() {
            try {
                const res = await fetch(${API_URL}/contact, {
                    headers: { 'Authorization': Bearer  }
                });
                const data = await res.json();
                
                if (data.success && data.data) {
                    document.getElementById('stats').innerHTML = 
                        <div class="stat-card"><div class="stat-number"></div><div>Total Messages</div></div>
                    ;
                    
                    const html = data.data.map(item => 
                        <tr>
                            <td></td>
                            <td><strong></strong></td>
                            <td></td>
                            <td><span class="badge"></span></td>
                            <td></td>
                            <td></td>
                        </tr>
                    ).join('');
                    document.getElementById('tableBody').innerHTML = html;
                }
            } catch(err) {
                console.error('Error loading data:', err);
            }
        }

        function logout() {
            token = null;
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('password').value = '';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        setInterval(() => { if (token) loadData(); }, 30000);
    </script>
</body>
</html>
